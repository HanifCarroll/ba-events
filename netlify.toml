[build]
  command = "bun install && bun run build"
  publish = "dist/client"

[build.environment]
  # Node 20 reached EOL 2026-04-30; Netlify default is now 24 (active LTS).
  # Also satisfies @netlify/vite-plugin-tanstack-start (^22.12 || >=24).
  NODE_VERSION = "24"
  # Disable Netlify's build cache to ensure clean builds
  NETLIFY_USE_YARN = "false"

# Service workers must never be served from the HTTP cache or updates stall
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
