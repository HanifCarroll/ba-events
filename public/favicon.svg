<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f06b5d"/>
      <stop offset="100%" stop-color="#d64a3a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Light background -->
  <rect width="32" height="32" rx="6" fill="#fafaf8"/>
  <!-- Subtle border -->
  <rect width="31" height="31" x="0.5" y="0.5" rx="5.5" fill="none" stroke="#e0ddd9" stroke-width="1"/>
  <!-- Coral vertical bar with glow -->
  <rect x="13" y="6" width="6" height="20" rx="3" fill="url(#bar)" filter="url(#glow)"/>
</svg>
