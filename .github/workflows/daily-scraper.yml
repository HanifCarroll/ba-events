name: Daily Passline Import

on:
  schedule:
    # Run daily at 6 AM UTC (3 AM Argentina time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  import-events:
    runs-on: ubuntu-latest
    steps:
      - name: Import Passline Events
        run: |
          echo "Starting Passline import..."

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.APP_URL }}/api/scraper/passline" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.SCRAPER_API_KEY }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Import failed with status $http_code"
            exit 1
          fi

          # Parse and display results
          imported=$(echo "$body" | jq -r '.imported // 0')
          pending=$(echo "$body" | jq -r '.pending // 0')
          skipped=$(echo "$body" | jq -r '.skipped // 0')
          total=$(echo "$body" | jq -r '.total // 0')

          echo "::notice::Import completed successfully"
          echo "  - Total events processed: $total"
          echo "  - Imported (with venue): $imported"
          echo "  - Pending review (no venue): $pending"
          echo "  - Skipped (already exists): $skipped"
