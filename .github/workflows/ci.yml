name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Paraglide runtime
        run: bun run paraglide:compile

      - name: Bun test runner
        run: bun test

      - name: Vitest suite
        run: bun run test

      - name: Svelte check
        run: bun run check

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Whitespace check
        run: git diff --check
