name: Generative tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generative-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.26
      - run: bun install --frozen-lockfile
      - run: bun run test:generative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generative-test-results
          path: tmp/fuzz/
          retention-days: 7
