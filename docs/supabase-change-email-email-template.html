<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your new email - BA Events</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f3f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="#f5f3f0" style="background-color: #f5f3f0;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 480px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="padding: 32px 32px 24px; text-align: center; border-bottom: 1px solid #e8e5e1;">
              <table role="presentation" cellspacing="0" cellpadding="0" align="center">
                <tr>
                  <td style="width: 4px; height: 28px; background: linear-gradient(to bottom, #d4af37, #b8860b); border-radius: 4px;"></td>
                  <td style="padding-left: 10px; font-size: 24px; font-weight: 600; color: #1a1612; letter-spacing: -0.5px;">BA Events</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 32px;">
              <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 600; color: #1a1612; text-align: center;">
                Confirm your new email
              </h1>
              <p style="margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: #57534e; text-align: center;">
                You requested to change your email address for your BA Events account. Please confirm this change by clicking the button below.
              </p>

              <!-- Button -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center">
                    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change"
                       style="display: inline-block; padding: 14px 32px; background-color: #1a1612; color: #d4af37; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 8px;">
                      Confirm New Email
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin: 28px 0 0; font-size: 13px; line-height: 1.6; color: #a8a29e; text-align: center;">
                This link will expire in 24 hours.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 32px; background-color: #faf8f5; border-top: 1px solid #e8e5e1;">
              <p style="margin: 0; font-size: 12px; color: #78716c; text-align: center; line-height: 1.5;">
                Discover the best events in Buenos Aires<br>
                &copy; 2025 BA Events
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
