schema: spec-driven

context: |
  BA Events is a SvelteKit 3 / Svelte 5 TypeScript application using Bun only.
  Canonical current-state requirements live in openspec/specs/. Architectural
  rationale lives in docs/decisions.md; current implementation and deterministic
  tests under src/ are the conformance evidence.
  Keep OpenSpec requirements canonical. Use $openspec-review-conformance for an
  advisory, citation-based comparison of affected requirements with code and
  tests. It does not replace OpenSpec validation or deterministic tests.
